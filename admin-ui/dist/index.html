<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OSS-KBDB Admin</title><link rel="stylesheet" href="styles.css"></head><body>
<aside><div class="brand"><b>OSS</b><span>KBDB</span><small>ADMIN CONSOLE</small></div>
<nav><button class="active" data-page="overview">Visão geral</button><button data-page="tenants">Tenants</button>
<button data-page="collections">Bases de conhecimento</button><button data-page="usage">Uso & métricas</button>
<button data-page="settings">Configurações</button></nav><div class="profile" id="profile">—<br><span>Não autenticado</span></div></aside>
<main><header><div><p class="eyebrow">PLATFORM / <span id="crumb">VISÃO GERAL</span></p><h1 id="title">Saúde da plataforma</h1></div>
<div class="actions"><select id="tenant-filter"><option value="">Todos os tenants</option></select><button class="secondary" id="new-tenant">+ Tenant</button><button class="primary" id="new-kb">+ Nova base</button></div></header>
<section id="app"></section></main>
<dialog id="login"><form id="login-form"><h2>Acessar OSS-KBDB</h2><label>E-mail<input id="email" type="email" required autocomplete="email"></label><label>Senha<input id="password" type="password" required autocomplete="current-password"></label><p id="login-error" class="error"></p><button class="primary">Entrar</button></form></dialog>
<dialog id="activate"><form id="activate-form"><h2>Ativar acesso</h2><p>Defina uma senha com pelo menos 16 caracteres.</p><label>Nova senha<input id="activation-password" type="password" minlength="16" required autocomplete="new-password"></label><p id="activation-error" class="error"></p><button class="primary">Ativar conta</button></form></dialog>
<dialog id="tenant-modal"><form id="tenant-form"><button class="close" type="button" data-close="tenant-modal">×</button><h2>Novo tenant</h2><label>Nome<input name="name" required></label><label>Slug<input name="slug" required pattern="[a-z0-9-]{2,50}"></label><label>E-mail do tenant-admin<input name="admin_email" type="email" required></label><p class="metric">Será enviado um e-mail de ativação para o registro da senha.</p><p id="tenant-error" class="error"></p><button class="primary">Criar tenant e enviar ativação</button></form></dialog>
<dialog id="kb-modal"><form id="kb-form"><button class="close" type="button" data-close="kb-modal">×</button><h2>Criar base de conhecimento</h2><label>Tenant<select name="tenant_id" required></select></label><label>Nome<input name="name" required></label><label>Slug<input name="slug" required pattern="[a-z0-9-]+"></label><label>PostgreSQL URL<input name="db_url" required placeholder="postgresql://host:5432/database"></label><label>Usuário PostgreSQL<input name="db_user"></label><label>Senha PostgreSQL<input name="db_password" type="password"></label><label>Bucket S3 / endpoint<input name="s3_url" required placeholder="https://minio.example"></label><label>Access key S3<input name="s3_key"></label><label>Secret S3<input name="s3_secret" type="password"></label><label>Embedding endpoint / modelo<input name="embedding" required placeholder="http://model:8000/v1 | bge-m3"></label><label>LLM endpoint / modelo<input name="llm" required placeholder="http://llm:8000/v1 | model"></label><label>Webhook de rejeição<input name="webhook" type="url"></label><p id="kb-error" class="error"></p><button class="primary">Cadastrar KB</button></form></dialog>
<dialog id="smtp-modal"><form id="smtp-form"><button class="close" type="button" data-close="smtp-modal">×</button><h2>Servidor SMTP</h2><label>Host<input name="host" required></label><label>Porta<input name="port" type="number" value="465" min="1" max="65535" required></label><label>Usuário<input name="username" required></label><label>Senha<input name="password" type="password" autocomplete="new-password"><small>Deixe vazia para manter a senha já salva.</small></label><label>Remetente<input name="sender" type="email" required></label><p id="smtp-error" class="error"></p><button class="primary">Salvar SMTP</button></form></dialog>
<script src="app.js"></script></body></html>
