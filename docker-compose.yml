services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: oss_kbdb
      POSTGRES_USER: oss_kbdb
      POSTGRES_PASSWORD: oss_kbdb
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oss_kbdb -d oss_kbdb"]
      interval: 5s
      timeout: 3s
      retries: 10
  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
