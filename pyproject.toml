[project]
name = "oss-kbdb"
version = "0.1.1"
description = "Open-source medallion knowledge base with hierarchical retrieval"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "boto3>=1.34",
  "psycopg[binary]>=3.2",
  "pypdf>=5.0",
  "beautifulsoup4>=4.12",
  "python-dotenv>=1.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "cryptography>=43",
  "PyJWT>=2.9",
  "argon2-cffi>=23.1",
]

[project.optional-dependencies]
local = ["sentence-transformers>=3.0"]
dev = ["pytest>=8.0"]

[project.scripts]
oss-kbdb = "oss_kbdb.cli:main"
oss-kbdb-bootstrap-admin = "oss_kbdb.bootstrap_admin:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["oss_kbdb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
